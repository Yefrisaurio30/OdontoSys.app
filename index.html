<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OdontoSys — Iniciar Sesión</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .login-card {
      width: 100%;
      max-width: 520px;
    }

    .login-logo {
      text-align: center;
      margin-bottom: 32px;
    }

    .login-logo .big-icon {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, var(--azul-primario), var(--azul-oscuro));
      border-radius: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      margin-bottom: 12px;
      box-shadow: 0 8px 24px rgba(59, 130, 196, 0.3);
    }

    .login-logo h1 {
      font-size: 1.75rem;
      color: var(--texto);
      margin-bottom: 4px;
    }

    .login-logo p {
      color: var(--gris-texto);
      font-size: 0.875rem;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 20px 0;
      color: var(--gris-texto);
      font-size: 0.8rem;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--gris-borde);
    }

    .register-link {
      text-align: center;
      margin-top: 20px;
      font-size: 0.875rem;
      color: var(--gris-texto);
    }

    .register-link a {
      color: var(--azul-primario);
      font-weight: 600;
      text-decoration: none;
    }

    .register-link a:hover { text-decoration: underline; }

    .demo-hint {
      background: var(--azul-claro);
      border: 1px solid var(--azul-medio);
      border-radius: var(--radio-sm);
      padding: 12px 16px;
      font-size: 0.8rem;
      color: var(--azul-oscuro);
      margin-top: 20px;
    }

    .demo-hint strong { display: block; margin-bottom: 4px; }

    .password-wrapper {
      position: relative;
    }

    .password-toggle {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--gris-texto);
      font-size: 1rem;
      padding: 4px;
    }

    .password-wrapper .form-input { padding-right: 42px; }
  </style>
</head>
<body>
  <div class="page-center">
    <div id="toast-container"></div>

    <div class="card login-card">
      <div class="login-logo">
        <div class="big-icon">🦷</div>
        <h1>OdontoSys</h1>
        <p>Sistema de Gestión Odontológica</p>
      </div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="username">Usuario</label>
          <input id="username" type="text" class="form-input" placeholder="Tu nombre de usuario" autocomplete="username" />
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Contraseña</label>
          <div class="password-wrapper">
            <input id="password" type="password" class="form-input" placeholder="••••••••" autocomplete="current-password" />
            <button type="button" class="password-toggle" id="toggle-pass" title="Mostrar/ocultar contraseña">👁</button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-full" style="margin-top:8px;">
          Iniciar Sesión
        </button>
      </form>

      <div style="text-align:center;margin-top:16px;">
        <a href="recuperar.html" id="forgot-password-link" style="color:var(--azul-primario);font-size:0.85rem;text-decoration:none;">¿Olvidaste tu contraseña?</a>
      </div>

      <div class="divider">o</div>

      <div class="register-link">
        ¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script src="DAOHybrid.js"></script>
  <script>
    if (Session.get()) window.location.href = 'menu.html';

    document.getElementById('toggle-pass').addEventListener('click', () => {
      const input = document.getElementById('password');
      input.type = input.type === 'password' ? 'text' : 'password';
    });

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      if (!username || !password) { showToast('Ingresa usuario y contraseña.', 'warning'); return; }

      const btn = e.target.querySelector('button[type=submit]');
      btn.disabled = true; btn.textContent = 'Verificando…';

      try {
        const usuario = await DAO.login(username, password);
        showToast('Conexión a la base de datos exitosa.', 'info');
        if (usuario) {
          Session.set(usuario);
          const displayNombre = usuario.nombre || usuario.username || 'Usuario';
          showToast(`¡Bienvenido, ${displayNombre}!`, 'success');
          setTimeout(() => window.location.href = 'menu.html', 600);
        } else {
          showToast('Credenciales incorrectas.', 'error');
          document.getElementById('password').value = '';
          document.getElementById('password').focus();
        }
      } catch (err) {
        showToast('Error de conexión: ' + err.message, 'error');
      } finally {
        btn.disabled = false; btn.textContent = 'Iniciar Sesión';
      }
    });

    document.getElementById('username').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') document.getElementById('password').focus();
    });
  </script>
</body>
</html>
