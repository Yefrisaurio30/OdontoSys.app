<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OdontoSys — Citas</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div class="management-page">
    <div id="toast-container"></div>
    <div id="top-bar-container"></div>

    <div class="page-header">
      <div>
        <h2>📅 Programación de Citas</h2>
        <div class="subtitle">Gestión completa de citas odontológicas</div>
      </div>
    </div>

    <!-- Formulario -->
    <div class="form-section">
      <div class="form-section-title">
        <span class="icon-diente">✏️</span>
        <span id="form-title">Nueva Cita</span>
      </div>

      <div class="form-grid-4">
        <div class="form-group">
          <label class="form-label" style="display:flex; justify-content:space-between; align-items:center;">
            Paciente *
            <button id="btn-quick-paciente" class="btn btn-ghost btn-sm"
              style="padding: 2px 8px; font-size: 0.7rem; border-color: var(--azul-medio); color: var(--azul-oscuro);">➕
              Nuevo</button>
          </label>
          <select id="sel-paciente" class="form-select"></select>
        </div>
        <div class="form-group">
          <label class="form-label">Odontólogo *</label>
          <select id="sel-odontologo" class="form-select"></select>
        </div>
        <div class="form-group">
          <label class="form-label">Fecha y Hora *</label>
          <input id="txt-fecha" type="datetime-local" class="form-input" min="2026-01-01T00:00" max="2026-12-31T23:59" onkeydown="return false" />
        </div>
        <div class="form-group">
          <label class="form-label">Estado</label>
          <select id="sel-estado" class="form-select">
            <option>Pendiente</option>
            <option>Realizada</option>
            <option>Cancelada</option>
          </select>
        </div>
        <div class="form-group col-span-4">
          <label class="form-label">Motivo de consulta</label>
          <textarea id="txt-motivo" class="form-textarea" placeholder="Describe el motivo de la cita…"
            style="min-height:60px;"></textarea>
        </div>
      </div>

      <div class="btn-group">
        <button id="btn-add" class="btn btn-primary">📅 Agendar</button>
        <button id="btn-update" class="btn btn-secondary" disabled>💾 Actualizar</button>
        <button id="btn-delete" class="btn btn-danger" disabled>🗑 Eliminar</button>
        <button id="btn-clear" class="btn btn-ghost">✕ Limpiar</button>
      </div>
    </div>

    <!-- Tabla -->
    <div class="content-area">
      <div class="table-wrapper">
        <div class="table-actions">
          <div style="font-size:.8rem;color:var(--gris-texto);" id="table-count">0 citas</div>
          <div style="display:flex;gap:10px;flex-wrap:wrap;">
            <select id="filter-estado" class="form-select" style="width:140px;">
              <option value="">Todos los estados</option>
              <option>Pendiente</option>
              <option>Realizada</option>
              <option>Cancelada</option>
            </select>
            <input type="text" id="search" class="form-input" placeholder="🔍 Buscar…" style="width:200px;" />
          </div>
        </div>
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Paciente</th>
              <th>Odontólogo</th>
              <th>Fecha / Hora</th>
              <th>Estado</th>
              <th>Motivo</th>
            </tr>
          </thead>
          <tbody id="tabla-body"></tbody>
        </table>
      </div>
    </div>

    <!-- Modal Confirmación -->
    <div id="confirm-modal" class="modal-overlay hidden">
      <div class="modal-box">
        <h3 id="confirm-title">¿Confirmar acción?</h3>
        <p id="confirm-message">Esta acción no se puede deshacer.</p>
        <div class="modal-actions">
          <button id="confirm-no" class="btn btn-ghost">Cancelar</button>
          <button id="confirm-yes" class="btn btn-danger">Confirmar</button>
        </div>
      </div>
    </div>

    <!-- Modal Rápido Paciente -->
    <div id="paciente-modal" class="modal-overlay hidden">
      <div class="modal-box" style="max-width: 400px;">
        <h3>➕ Nuevo Paciente</h3>
        <p>Crea un expediente rápido para agendar la cita.</p>

        <div class="form-group">
          <label class="form-label">Nombre *</label>
          <input id="q-nombre" type="text" class="form-input" placeholder="Ej: Juan" />
        </div>
        <div class="form-group">
          <label class="form-label">Apellido *</label>
          <input id="q-apellido" type="text" class="form-input" placeholder="Ej: Pérez" />
        </div>
        <div class="form-group">
          <label class="form-label">DNI *</label>
          <input id="q-dni" type="text" class="form-input" placeholder="DNI o Identificación" />
        </div>

        <div class="modal-actions">
          <button id="btn-q-cancel" class="btn btn-ghost">Cancelar</button>
          <button id="btn-q-save" class="btn btn-primary">Guardar Paciente</button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script src="DAOHybrid.js"></script>
  <script>
    if (!Session.requireAdmin()) throw 'no admin';
    document.getElementById('top-bar-container').innerHTML = renderTopBar('Citas');

    let selectedId = null;
    let all = [];

    async function loadSelects() {
      const [pacs, odos] = await Promise.all([DAO.getPacientes(), DAO.getOdontologos()]);

      const pacOpts = '<option value="">— Seleccione Paciente —</option>' +
        pacs.map(p => `<option value="${p.id}">${p.nombre} ${p.apellido}</option>`).join('');
      document.getElementById('sel-paciente').innerHTML = pacOpts;

      const odoOpts = '<option value="">— Seleccione Odontólogo —</option>' +
        odos.map(o => `<option value="${o.id}">Dr. ${o.nombre} ${o.apellido} — ${o.especialidad}</option>`).join('');
      document.getElementById('sel-odontologo').innerHTML = odoOpts;

      await DAO.loadNombreCache();
    }

    function badgeEstado(estado) {
      const cls = { Pendiente: 'badge-pendiente', Realizada: 'badge-realizada', Cancelada: 'badge-cancelada' }[estado] || '';
      return `<span class="badge ${cls}">${estado}</span>`;
    }

    function formatDate(str) {
      if (!str) return '—';
      try { return new Date(str.replace(' ', 'T')).toLocaleString('es-CO', { dateStyle: 'short', timeStyle: 'short' }); }
      catch { return str; }
    }

    function render(list) {
      const tbody = document.getElementById('tabla-body');
      document.getElementById('table-count').textContent = `${list.length} cita${list.length !== 1 ? 's' : ''}`;
      if (list.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="empty-state"><span class="icon">📅</span>No hay citas.</td></tr>'; return;
      }
      tbody.innerHTML = list.map(c => `
        <tr class="${c.id === selectedId ? 'selected' : ''}" data-id="${c.id}">
          <td style="font-size:.75rem;max-width:80px;overflow:hidden;text-overflow:ellipsis;" title="${c.id}">${String(c.id).substring(0,8)}…</td>
          <td><strong>${DAO.nombrePaciente(c.idPaciente)}</strong></td>
          <td>${DAO.nombreOdontologo(c.idOdontologo)}</td>
          <td>${formatDate(c.fechaHora)}</td>
          <td>${badgeEstado(c.estado)}</td>
          <td style="max-width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" title="${c.motivo || ''}">${c.motivo || '—'}</td>
        </tr>`).join('');
      tbody.querySelectorAll('tr[data-id]').forEach(row =>
        row.addEventListener('click', () => selectRow(row.dataset.id)));
    }

    async function load() {
      try { all = await DAO.getCitas(); applyFilters(); }
      catch (e) { showToast('Error: ' + e.message, 'error'); }
    }

    function applyFilters() {
      const q = document.getElementById('search').value.toLowerCase();
      const estado = document.getElementById('filter-estado').value;
      let filtered = all;
      if (estado) filtered = filtered.filter(c => c.estado === estado);
      if (q) filtered = filtered.filter(c =>
        DAO.nombrePaciente(c.idPaciente).toLowerCase().includes(q) ||
        DAO.nombreOdontologo(c.idOdontologo).toLowerCase().includes(q) ||
        (c.motivo || '').toLowerCase().includes(q));
      render(filtered);
    }

    function selectRow(id) {
      selectedId = id;
      const c = all.find(x => String(x.id) === String(id)); if (!c) return;
      document.getElementById('sel-paciente').value   = String(c.idPaciente);
      document.getElementById('sel-odontologo').value = String(c.idOdontologo);
      document.getElementById('txt-fecha').value  = (c.fechaHora || '').replace(' ', 'T').substring(0, 16);
      document.getElementById('sel-estado').value = c.estado;
      document.getElementById('txt-motivo').value = c.motivo || '';
      document.getElementById('form-title').textContent = 'Editar Cita';
      document.getElementById('btn-add').disabled    = true;
      document.getElementById('btn-update').disabled = false;
      document.getElementById('btn-delete').disabled = false;
      applyFilters();
    }

    function clearForm() {
      selectedId = null;
      document.getElementById('txt-fecha').value   = '';
      document.getElementById('txt-motivo').value  = '';
      document.getElementById('sel-estado').value  = 'Pendiente';
      document.getElementById('sel-paciente').value   = '';
      document.getElementById('sel-odontologo').value = '';
      document.getElementById('form-title').textContent  = 'Nueva Cita';
      document.getElementById('btn-add').disabled    = false;
      document.getElementById('btn-update').disabled = true;
      document.getElementById('btn-delete').disabled = true;
      applyFilters();
    }

    function getCitaFromForm() {
      const pId = document.getElementById('sel-paciente').value;
      const oId = document.getElementById('sel-odontologo').value;
      if (!pId || !oId) return null;
      return {
        idPaciente:   pId,   // string (MongoDB _id)
        idOdontologo: oId,
        fechaHora: document.getElementById('txt-fecha').value.replace('T', ' '),
        estado:    document.getElementById('sel-estado').value,
        motivo:    document.getElementById('txt-motivo').value.trim()
      };
    }

    document.getElementById('btn-add').addEventListener('click', async () => {
      const data = getCitaFromForm();
      if (!data) { showToast('Selecciona un paciente y un odontólogo.', 'warning'); return; }
      if (!data.fechaHora) { showToast('La fecha y hora son obligatorias.', 'warning'); return; }
      try {
        await DAO.addCita(data);
        showToast('Cita agendada.', 'success');
        clearForm();
        await load();
      } catch (e) { showToast('Error: ' + e.message, 'error'); }
    });

    document.getElementById('btn-update').addEventListener('click', async () => {
      if (selectedId === -1) return;
      try { await DAO.updateCita({ id: selectedId, ...getCitaFromForm() }); showToast('Cita actualizada.', 'success'); clearForm(); await load(); }
      catch (e) { showToast('Error: ' + e.message, 'error'); }
    });

    document.getElementById('btn-delete').addEventListener('click', async () => {
      if (!selectedId) return;
      const c = all.find(x => String(x.id) === String(selectedId));
      const ok = await confirmDialog('Eliminar Cita', `¿Eliminar la cita de ${DAO.nombrePaciente(c.idPaciente)}?`);
      if (!ok) return;
      try { await DAO.deleteCita(selectedId); showToast('Cita eliminada.', 'success'); clearForm(); await load(); }
      catch (e) { showToast('Error: ' + e.message, 'error'); }
    });

    document.getElementById('btn-clear').addEventListener('click', clearForm);
    document.getElementById('search').addEventListener('input', applyFilters);
    document.getElementById('filter-estado').addEventListener('change', applyFilters);

    // Lógica Modal Rápido Paciente
    const pModal = document.getElementById('paciente-modal');
    document.getElementById('btn-quick-paciente').onclick = () => {
      pModal.classList.remove('hidden');
      document.getElementById('q-nombre').focus();
    };

    document.getElementById('btn-q-cancel').onclick = () => {
      pModal.classList.add('hidden');
      ['q-nombre', 'q-apellido', 'q-dni'].forEach(id => document.getElementById(id).value = '');
    };

    document.getElementById('btn-q-save').onclick = async () => {
      const nombre = document.getElementById('q-nombre').value.trim();
      const apellido = document.getElementById('q-apellido').value.trim();
      const dni = document.getElementById('q-dni').value.trim();

      if (!nombre || !apellido || !dni) {
        showToast('Completa los campos obligatorios.', 'warning');
        return;
      }

      try {
        const nuevo = await DAO.addPaciente({ nombre, apellido, dni, usuarioId: null });
        showToast('Paciente creado con éxito.', 'success');
        // Recargar selects y seleccionar al nuevo
        await loadSelects();
        const newId = String(nuevo._id || nuevo.id || '');
        if (newId) document.getElementById('sel-paciente').value = newId;
        pModal.classList.add('hidden');
        ['q-nombre', 'q-apellido', 'q-dni'].forEach(id => document.getElementById(id).value = '');
      } catch (err) {
        showToast('Error al crear paciente: ' + err.message, 'error');
      }
    };

    (async () => { await loadSelects(); await load(); })();

  </script>
</body>

</html>
