<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OdontoSys — Restablecer Contraseña</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .reset-card { width: 100%; max-width: 480px; }
  </style>
</head>
<body>
  <div class="page-center">
    <div id="toast-container"></div>
    <div class="card reset-card">
      <div style="text-align: center; margin-bottom: 30px;">
        <h2 style="font-family: 'DM Serif Display', serif; font-size: 1.5rem;">Nueva Contraseña</h2>
        <p style="color: var(--gris-texto); font-size: 0.9rem; margin-top: 8px;">
          Ingresa tu nueva clave para recuperar el acceso a tu cuenta.
        </p>
      </div>

      <form id="reset-form">
        <div class="form-group">
          <label class="form-label" for="pass1">Nueva Contraseña</label>
          <input type="password" id="pass1" class="form-input" placeholder="Mínimo 6 caracteres" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="pass2">Confirmar Contraseña</label>
          <input type="password" id="pass2" class="form-input" placeholder="Repite la contraseña" required>
        </div>
        <button type="submit" class="btn btn-primary btn-full">Actualizar contraseña</button>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
  <script src="DAOHybrid.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');

    if (!token) {
      showToast('Token de recuperación no encontrado.', 'error');
      setTimeout(() => window.location.href = 'index.html', 3000);
    }

    document.getElementById('reset-form').onsubmit = async (e) => {
      e.preventDefault();
      const p1 = document.getElementById('pass1').value;
      const p2 = document.getElementById('pass2').value;

      if (p1 !== p2) {
        showToast('Las contraseñas no coinciden.', 'warning');
        return;
      }
      if (p1.length < 6) {
        showToast('Mínimo 6 caracteres.', 'warning');
        return;
      }

      const btn = e.target.querySelector('button');
      btn.disabled = true;
      btn.textContent = 'Actualizando...';

      try {
        await DAO.resetPassword(token, p1);
        showToast('¡Contraseña actualizada! Ya puedes iniciar sesión.', 'success');
        setTimeout(() => window.location.href = 'index.html', 2500);
      } catch (err) {
        showToast(err.message, 'error');
        btn.disabled = false;
        btn.textContent = 'Actualizar contraseña';
      }
    };
  </script>
</body>
</html>
