<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OdontoSys — Inventario</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .info-banner { background: linear-gradient(135deg, #E6F0FA 0%, #D1FAE5 100%); border: 1px solid #6EE7B7; border-radius: var(--radio); padding: 14px 20px; margin-bottom: 20px; display: flex; align-items: center; gap: 12px; }
    .db-badge { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 20px; font-size: 0.7rem; font-weight: 600; }
    .db-badge.mongodb { background: #D1FAE5; color: #065F46; }
  </style>
</head>
<body>
  <div class="management-page">
    <div id="toast-container"></div>
    <div id="top-bar-container"></div>

    <div class="page-header">
      <div>
        <h2>📦 Gestión de Inventario</h2>
        <p class="subtitle">Colección productos — MongoDB Atlas</p>
      </div>
      <span class="db-badge mongodb">🟢 MongoDB</span>
    </div>

    <!-- Formulario -->
    <div class="form-section">
      <div class="form-section-title">🧪 <span id="form-title-inv">Agregar Producto</span></div>
      <form id="producto-form">
        <div class="form-grid">
          <div class="form-group">
            <label class="form-label" for="nombre">Nombre *</label>
            <input id="nombre" type="text" class="form-input" placeholder="Ej: Pasta dental" required />
          </div>
          <div class="form-group">
            <label class="form-label" for="categoria">Categoría</label>
            <select id="categoria" class="form-select">
              <option value="insumos">Insumos</option>
              <option value="medicamentos">Medicamentos</option>
              <option value="equipos">Equipos</option>
              <option value="descartables">Descartables</option>
              <option value="general">General</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label" for="stock">Stock</label>
            <input id="stock" type="number" class="form-input" min="0" value="0" />
          </div>
          <div class="form-group">
            <label class="form-label" for="precio">Precio Unitario ($)</label>
            <input id="precio" type="number" class="form-input" min="0" step="0.01" value="0.00" />
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="descripcion">Descripción</label>
          <textarea id="descripcion" class="form-textarea" placeholder="Descripción del producto..."></textarea>
        </div>
        <div class="btn-group">
          <button type="submit" id="btn-guardar" class="btn btn-primary">💾 Guardar</button>
          <button type="button" id="btn-limpiar" class="btn btn-ghost">✕ Limpiar</button>
        </div>
      </form>
    </div>

    <!-- Tabla -->
    <div class="table-actions">
      <div class="btn-group">
        <button id="btn-recargar" class="btn btn-secondary">🔄 Recargar</button>
        <span id="table-count" style="font-size:0.8rem;color:var(--gris-texto);">Cargando...</span>
      </div>
    </div>

    <div class="content-area">
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Nombre</th>
              <th>Descripción</th>
              <th>Precio</th>
              <th>Stock</th>
              <th>Categoría</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tabla-inventario">
            <tr><td colspan="6" class="empty-state">Cargando inventario...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <div id="confirm-modal" class="modal-overlay hidden">
      <div class="modal-box">
        <h3 id="confirm-title">¿Confirmar?</h3>
        <p id="confirm-message">Esta acción no se puede deshacer.</p>
        <div class="modal-actions">
          <button id="confirm-no" class="btn btn-ghost">Cancelar</button>
          <button id="confirm-yes" class="btn btn-danger">Confirmar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script src="DAOHybrid.js"></script>
  <script>
    if (!localStorage.getItem('token')) window.location.href = 'login.html';
    document.getElementById('top-bar-container').innerHTML = renderTopBar('Inventario');

    let editId = null;
    const tabla = document.getElementById('tabla-inventario');
    const form = document.getElementById('producto-form');

    function colorStock(stock) {
      if (stock === 0) return 'background:#ffcccc';
      if (stock <= 5) return 'background:#fff3cd';
      return '';
    }

    async function cargarInventario() {
      tabla.innerHTML = '<tr><td colspan="6" class="empty-state">Cargando...</td></tr>';
      try {
        const items = await DAO.getProductos();
        document.getElementById('table-count').textContent = `${items.length} producto${items.length !== 1 ? 's' : ''}`;

        if (!items || items.length === 0) {
          tabla.innerHTML = '<tr><td colspan="6" class="empty-state">No hay productos. Agrega el primero ↑</td></tr>';
          return;
        }

        tabla.innerHTML = items.map(item => {
          const id = item._id || item.id || '';
          const stock = Number(item.stock) || 0;
          return `<tr style="${colorStock(stock)}">
            <td><strong>${item.nombre || '—'}</strong></td>
            <td style="max-width:180px;font-size:0.8rem;">${item.descripcion || '—'}</td>
            <td>$${Number(item.precio || 0).toFixed(2)}</td>
            <td><strong>${stock}</strong></td>
            <td><span class="badge">${item.categoria || '—'}</span></td>
            <td>
              <button class="btn-eye" onclick="editarProducto('${id}')">✏️</button>
              <button class="btn-eye" onclick="eliminarProducto('${id}', '${(item.nombre||'').replace(/'/g,"\\'")}')">🗑️</button>
            </td>
          </tr>`;
        }).join('');
      } catch (e) {
        tabla.innerHTML = `<tr><td colspan="6" class="empty-state" style="color:#dc2626;">❌ Error: ${e.message}</td></tr>`;
      }
    }

    window.editarProducto = async function(id) {
      try {
        const item = await DAO.getProducto(id);
        if (!item) { showToast('Producto no encontrado', 'error'); return; }
        document.getElementById('nombre').value = item.nombre || '';
        document.getElementById('categoria').value = item.categoria || 'general';
        document.getElementById('stock').value = item.stock || 0;
        document.getElementById('precio').value = item.precio || 0;
        document.getElementById('descripcion').value = item.descripcion || '';
        editId = id;
        document.getElementById('btn-guardar').textContent = '✏️ Actualizar';
        document.getElementById('form-title-inv').textContent = 'Editar Producto';
        showToast('Editando: ' + item.nombre, 'info');
      } catch (e) { showToast('Error: ' + e.message, 'error'); }
    };

    window.eliminarProducto = async function(id, nombre) {
      const ok = await confirmDialog('Eliminar Producto', `¿Eliminar "${nombre}"?`);
      if (!ok) return;
      try {
        await DAO.deleteProducto(id);
        showToast('Producto eliminado.', 'success');
        cargarInventario();
      } catch (e) { showToast('Error: ' + e.message, 'error'); }
    };

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const producto = {
        nombre: document.getElementById('nombre').value.trim(),
        categoria: document.getElementById('categoria').value,
        stock: parseInt(document.getElementById('stock').value) || 0,
        precio: parseFloat(document.getElementById('precio').value) || 0,
        descripcion: document.getElementById('descripcion').value.trim(),
      };
      if (!producto.nombre) { showToast('El nombre es obligatorio.', 'warning'); return; }

      const btn = document.getElementById('btn-guardar');
      btn.disabled = true;
      try {
        if (editId) {
          await DAO.updateProducto({ id: editId, ...producto });
          showToast('Producto actualizado ✅', 'success');
        } else {
          await DAO.addProducto(producto);
          showToast('Producto agregado ✅', 'success');
        }
        document.getElementById('btn-limpiar').click();
        cargarInventario();
      } catch (e) { showToast('Error: ' + e.message, 'error'); }
      finally { btn.disabled = false; }
    });

    document.getElementById('btn-limpiar').addEventListener('click', () => {
      form.reset();
      document.getElementById('stock').value = '0';
      document.getElementById('precio').value = '0.00';
      editId = null;
      document.getElementById('btn-guardar').textContent = '💾 Guardar';
      document.getElementById('form-title-inv').textContent = 'Agregar Producto';
    });

    document.getElementById('btn-recargar').addEventListener('click', cargarInventario);
    cargarInventario();
  </script>
</body>
</html>
