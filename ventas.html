<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OdontoSys — Ventas</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .seccion { background: white; border-radius: var(--radio); padding: 20px; margin-bottom: 20px; box-shadow: var(--sombra); }
    .seccion h3 { margin-bottom: 15px; color: var(--azul-primario); }
    .carrito-item { display: flex; gap: 10px; align-items: center; padding: 8px; border-bottom: 1px solid #e2e8f0; }
    .carrito-item span { flex: 1; }
    .total-text { font-size: 1.2rem; font-weight: 600; color: var(--azul-primario); }
    
    /* Modal de Registro Rápido */
    .modal-registro {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center;
      z-index: 1000;
    }
    .modal-registro.hidden { display: none; }
    .modal-registro-content {
      background: white; padding: 30px; border-radius: 16px; width: 100%; max-width: 450px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
    }
  </style>
</head>
<body>
  <div class="management-page">
    <div id="toast-container"></div>
    <div id="top-bar-container"></div>

    <div class="page-header">
      <div>
        <h2>🛒 Venta de Productos</h2>
        <p class="subtitle">Seleccione paciente y productos para generar factura</p>
      </div>
    </div>
 
    <!-- Zona 1: Selección de paciente -->
    <div class="seccion">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
        <h3 style="margin:0;">👤 Paciente</h3>
        <button onclick="toggleModalRegistro(true)" class="btn btn-secondary btn-sm">➕ Nuevo Paciente</button>
      </div>

      <div style="display:flex; gap:10px; margin-bottom:15px;">
        <input id="cedula-busqueda" type="text" class="form-input" placeholder="🔍 Buscar por cédula..." style="flex:1;" />
        <button onclick="buscarPorCedula()" class="btn btn-secondary">Buscar</button>
      </div>

      <div style="margin-bottom:15px;">
        <label class="form-label" style="font-size:0.75rem;">O seleccionar de la lista:</label>
        <select id="select-cliente-lista" class="form-select" onchange="seleccionarDeLista()">
          <option value="">— Seleccionar paciente —</option>
        </select>
      </div>
      <div id="info-cliente" style="padding:10px;background:#f8fafc;border-radius:8px;font-size:0.9rem;">
        No hay paciente seleccionado
      </div>
    </div>

    <!-- Zona 2: Carrito de productos -->
    <div class="seccion">
      <h3>📦 Productos</h3>
      <div style="display:flex;gap:10px;margin-bottom:15px;">
        <select id="select-producto" class="form-select" style="flex:1;"></select>
        <input id="cantidad-producto" type="number" class="form-input" min="1" value="1" style="width:80px;" />
        <button onclick="agregarAlCarrito()" class="btn btn-primary">➕ Agregar</button>
      </div>

      <div id="carrito-container"></div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:15px;padding-top:15px;border-top:2px solid #e2e8f0;">
        <div class="total-text">Total: $<span id="total-venta">0</span></div>
        <button onclick="registrarVenta()" class="btn btn-primary" style="font-size:1rem;padding:10px 20px;">💳 Registrar Venta</button>
      </div>
    </div>

    <div id="confirm-modal" class="modal-overlay hidden">
      <div class="modal-box">
        <h3 id="confirm-title">¿Confirmar?</h3>
        <p id="confirm-message"></p>
        <div class="modal-actions">
          <button id="confirm-no" class="btn btn-ghost">Cancelar</button>
          <button id="confirm-yes" class="btn btn-danger">Confirmar</button>
        </div>
      </div>
    </div>

    <!-- Modal Registro Rápido -->
    <div id="modal-registro" class="modal-registro hidden">
      <div class="modal-registro-content">
        <h3 style="margin-bottom:20px; color:var(--azul-primario);">📝 Registro Rápido de Paciente</h3>
        <div class="form-group">
          <label class="form-label">Nombre *</label>
          <input type="text" id="reg-nombre" class="form-input" placeholder="Nombre" />
        </div>
        <div class="form-group">
          <label class="form-label">Apellido *</label>
          <input type="text" id="reg-apellido" class="form-input" placeholder="Apellido" />
        </div>
        <div class="form-group">
          <label class="form-label">Cédula *</label>
          <input type="text" id="reg-cedula" class="form-input" placeholder="Número de documento" />
        </div>
        <div class="form-group">
          <label class="form-label">Teléfono *</label>
          <input type="text" id="reg-telefono" class="form-input" placeholder="Mínimo 10 dígitos" />
        </div>
        <div class="form-group">
          <label class="form-label">RUT (PDF) *</label>
          <input type="file" id="reg-rut" class="form-input" accept=".pdf" />
        </div>
        <div style="display:flex; gap:10px; margin-top:20px;">
          <button onclick="toggleModalRegistro(false)" class="btn btn-ghost" style="flex:1;">Cancelar</button>
          <button onclick="guardarPacienteRapido()" class="btn btn-primary" style="flex:1;">Guardar y Seleccionar</button>
        </div>
      </div>
    </div>



    <!-- ── Sección de reimpresión ───────────────────────────────────────── -->
    <div class="seccion">
      <h3>📄 Historial de ventas — Reimprimir factura</h3>
      <div class="table-wrapper">
        <table style="width:100%; border-collapse:collapse;">
          <thead>
            <tr>
              <th>Nº Factura</th>
              <th>Cliente</th>
              <th>Fecha</th>
              <th>Total</th>
              <th>Acción</th>
            </tr>
          </thead>
          <tbody id="tbody-historial">
            <tr><td colspan="5" style="text-align:center">Cargando historial...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script src="DAOHybrid.js"></script>
  <script>
    if (!localStorage.getItem('token')) window.location.href = 'login.html';
    document.getElementById('top-bar-container').innerHTML = renderTopBar('Ventas');

    // Restricciones en tiempo real
    document.getElementById('cedula-busqueda').addEventListener('input', Validator.soloNumeros);
    document.getElementById('reg-nombre').addEventListener('input', Validator.soloLetras);
    document.getElementById('reg-apellido').addEventListener('input', Validator.soloLetras);
    document.getElementById('reg-cedula').addEventListener('input', Validator.soloNumeros);
    document.getElementById('reg-telefono').addEventListener('input', Validator.soloNumeros);

    let clienteSeleccionado = null;
    let carrito = [];
    let productosDisponibles = [];

    async function cargarProductos() {
      try {
        productosDisponibles = await DAO.getProductos();
        const select = document.getElementById('select-producto');
        select.innerHTML = productosDisponibles.map(p =>
          `<option value="${p._id || p.id}">${p.nombre} - $${Number(p.precio).toFixed(2)} (Stock: ${p.stock})</option>`
        ).join('');
      } catch (e) { showToast('Error cargando productos: ' + e.message, 'error'); }
    }

    async function cargarClientes(idParaSeleccionar = null) {
      try {
        const pacientes = await DAO.getPacientes();
        const select = document.getElementById('select-cliente-lista');
        select.innerHTML = '<option value="">— Seleccionar paciente —</option>' + 
          pacientes.map(p => `<option value="${p.id || p._id}" data-cedula="${p.cedula}">${p.nombre} ${p.apellido} (${p.cedula})</option>`).join('');
        
        if (idParaSeleccionar) {
          select.value = idParaSeleccionar;
          seleccionarDeLista();
        }
      } catch (e) { console.error('Error cargando pacientes:', e); }
    }

    async function buscarPorCedula() {
      const cedula = document.getElementById('cedula-busqueda').value.trim();
      if (!cedula) return showToast('Ingrese una cédula para buscar.', 'warning');

      try {
        const res = await fetch(`/api/clientes/buscar?cedula=${cedula}`, {
          headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
        });
        const data = await res.json();

        if (!res.ok) {
          showToast('❌ Paciente no encontrado.', 'error');
          clienteSeleccionado = null;
          document.getElementById('info-cliente').innerHTML = 'No hay paciente seleccionado';
          document.getElementById('select-cliente-lista').value = "";
          return;
        }

        // Seleccionar en el dropdown
        const select = document.getElementById('select-cliente-lista');
        select.value = data._id || data.id;
        
        if (select.value) {
          seleccionarDeLista();
          showToast('✅ Paciente encontrado.', 'success');
        } else {
          // Si por alguna razón no está en la lista (raro), lo cargamos manualmente
          clienteSeleccionado = data;
          actualizarInfoCliente();
        }
      } catch (e) { showToast('Error: ' + e.message, 'error'); }
    }

    // El buscarCliente se ha eliminado. Solo se usa la lista.
    
    function seleccionarDeLista() {
      const select = document.getElementById('select-cliente-lista');
      const id = select.value;
      if (!id) {
        clienteSeleccionado = null;
        document.getElementById('info-cliente').innerHTML = 'No hay paciente seleccionado';
        return;
      }
      
      const option = select.options[select.selectedIndex];
      // Extraer nombre y cédula del texto del option "Nombre Apellido (Cedula)"
      const text = option.text;
      const match = text.match(/^(.*)\s\((.*)\)$/);
      
      clienteSeleccionado = { 
        id: id, 
        _id: id,
        nombre: match ? match[1] : text, 
        cedula: match ? match[2] : '' 
      };
      actualizarInfoCliente();
    }

    function toggleModalRegistro(ver) {
      document.getElementById('modal-registro').classList.toggle('hidden', !ver);
      if (ver) {
        // Limpiar campos
        document.getElementById('reg-nombre').value = '';
        document.getElementById('reg-apellido').value = '';
        document.getElementById('reg-cedula').value = '';
        document.getElementById('reg-telefono').value = '';
        document.getElementById('reg-rut').value = '';
      }
    }

    async function guardarPacienteRapido() {
      const nombre = document.getElementById('reg-nombre').value.trim();
      const apellido = document.getElementById('reg-apellido').value.trim();
      const cedula = document.getElementById('reg-cedula').value.trim();
      const telefono = document.getElementById('reg-telefono').value.trim();
      const rutFile = document.getElementById('reg-rut').files[0];

      if (!nombre || !apellido || !cedula || !telefono || !rutFile) {
        return showToast('Todos los campos (*) son obligatorios.', 'warning');
      }

      // Validaciones Globales Robustas
      const soloLetras = /^[a-zA-ZáéíóúÁÉÍÓÚñÑ\s]+$/;
      const soloNumeros = /^[0-9]+$/;

      if (!soloLetras.test(nombre) || !soloLetras.test(apellido)) {
        return showToast('Nombre y Apellido solo deben contener letras.', 'warning');
      }
      if (!soloNumeros.test(cedula)) {
        return showToast('La Cédula solo debe contener números.', 'warning');
      }
      if (!soloNumeros.test(telefono) || telefono.length < 10) {
        return showToast('El Teléfono debe tener al menos 10 números.', 'warning');
      }

      const fd = new FormData();
      fd.append('nombre', nombre);
      fd.append('apellido', apellido);
      fd.append('cedula', cedula);
      fd.append('telefono', telefono);
      fd.append('rut_pdf', rutFile);

      try {
        const res = await fetch('/api/clientes', {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` },
          body: fd
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Error registrando paciente');

        showToast('✅ Paciente registrado y seleccionado.', 'success');
        toggleModalRegistro(false);
        await cargarClientes(data.id || data._id);
      } catch (e) { showToast(e.message, 'error'); }
    }

    function actualizarInfoCliente() {
      if (!clienteSeleccionado) return;
      document.getElementById('info-cliente').innerHTML =
          `<strong>${clienteSeleccionado.nombre}</strong><br/>CC: ${clienteSeleccionado.cedula}`;
    }



    function agregarAlCarrito() {
      const productoId = document.getElementById('select-producto').value;
      const cantidad = parseInt(document.getElementById('cantidad-producto').value) || 1;
      const producto = productosDisponibles.find(p => (p._id || p.id) === productoId);
      if (!producto) return;

      const existente = carrito.find(i => (i.producto_id) === productoId);
      if (existente) {
        existente.cantidad += cantidad;
      } else {
        carrito.push({ producto_id: productoId, nombre: producto.nombre, cantidad, precio: producto.precio });
      }
      renderCarrito();
    }

    function renderCarrito() {
      const container = document.getElementById('carrito-container');
      if (carrito.length === 0) {
        container.innerHTML = '<p style="color:#64748B;text-align:center;">El carrito está vacío</p>';
        document.getElementById('total-venta').textContent = '0';
        return;
      }

      let total = 0;
      container.innerHTML = carrito.map((item, idx) => {
        const subtotal = item.cantidad * item.precio;
        total += subtotal;
        return `<div class="carrito-item">
          <span>${item.nombre}</span>
          <span>${item.cantidad} x $${Number(item.precio).toFixed(2)}</span>
          <span><strong>$${subtotal.toFixed(2)}</strong></span>
          <button onclick="eliminarDelCarrito(${idx})" style="background:none;border:none;cursor:pointer;">🗑️</button>
        </div>`;
      }).join('');

      document.getElementById('total-venta').textContent = total.toFixed(2);
    }

    function eliminarDelCarrito(idx) {
      carrito.splice(idx, 1);
      renderCarrito();
    }

    async function registrarVenta() {
      if (!clienteSeleccionado) return alert('Seleccione un paciente primero');
      if (carrito.length === 0) return alert('Agregue al menos un producto');

      const body = {
        cliente_id: clienteSeleccionado._id || clienteSeleccionado.id,
        items: carrito.map(i => ({ producto_id: i.producto_id, cantidad: i.cantidad }))
      };

      try {
        const res = await fetch('/api/ventas', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${localStorage.getItem('token')}` },
          body: JSON.stringify(body)
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Error registrando venta');

        alert(`Venta registrada. Factura: ${data.factura_id}`);
        const token = localStorage.getItem('token');
        window.open(`/api/ventas/${data.factura_id}/pdf?token=${token}`, '_blank');
        carrito = [];
        renderCarrito();
        cargarProductos();
        cargarHistorial();
      } catch (e) { showToast('Error: ' + e.message, 'error'); }
    }

    async function cargarHistorial() {
      try {
        const res = await fetch('/api/ventas', {
          headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
        });
        const ventas = await res.json();
        const tbody = document.getElementById('tbody-historial');
        tbody.innerHTML = '';

        if (!ventas || ventas.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5" style="text-align:center">Sin ventas registradas</td></tr>';
          return;
        }

        ventas.forEach(v => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${v.factura_id}</td>
            <td>${v.cliente_nombre}<br><small>CC: ${v.cliente_cedula}</small></td>
            <td>${new Date(v.fecha).toLocaleString('es-CO')}</td>
            <td>$${v.total.toLocaleString()}</td>
            <td>
              <button onclick="reimprimirFactura('${v.factura_id}')" class="btn btn-ghost btn-sm">
                🖨️ Reimprimir
              </button>
            </td>
          `;
          tbody.appendChild(tr);
        });
      } catch (e) { console.error('Error cargando historial:', e); }
    }

    function reimprimirFactura(facturaId) {
      const token = localStorage.getItem('token');
      window.open(`/api/ventas/${facturaId}/pdf?token=${token}`, '_blank');
    }

    cargarProductos();
    cargarClientes();
    cargarHistorial();
  </script>
</body>
</html>
